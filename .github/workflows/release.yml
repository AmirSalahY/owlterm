name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build specs
        run: npm run build:specs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          PRERELEASE_ARGS=()
          case "$TAG" in
            *-*) PRERELEASE_ARGS=(--prerelease --latest=false) ;;
            *) PRERELEASE_ARGS=(--latest) ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              "${PRERELEASE_ARGS[@]}"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "${PRERELEASE_ARGS[@]}"
          fi
